name: build brand icons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-brand-icons.yml'
      - 'scripts/build_brand_icons.py'
      - 'assets/favicon.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build PNG icons
        run: python scripts/build_brand_icons.py

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/favicon-32.png assets/apple-touch-icon.png
          if git diff --cached --quiet; then
            echo "No icon changes to commit."
            exit 0
          fi
          git commit -m "Generate favicon and Apple touch icon"
          git push
