name: optimize responsive images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-images.yml'
      - 'scripts/optimize_images.py'
      - 'assets/images/place-*.jpg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build responsive WebP images
        run: python scripts/optimize_images.py

      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/place-*-900.webp assets/images/place-*-1500.webp assets/images/place-*-2200.webp
          if git diff --cached --quiet; then
            echo "No optimized image changes to commit."
            exit 0
          fi
          git commit -m "Generate responsive WebP images"
          git push
